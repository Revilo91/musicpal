name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch breakage caused by new Home Assistant / HACS releases.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # "topics" needs a GitHub repo setting (not repo content) and
          # "brands" requires a home-assistant/brands submission; both are
          # external to this repository, so don't fail CI on them.
          ignore: brands topics

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy homeassistant types-beautifulsoup4
      - name: Ruff format
        run: ruff format --check musicpal custom_components/
      - name: Ruff lint
        run: ruff check musicpal custom_components/
      - name: Mypy
        run: >-
          mypy --scripts-are-modules
          --disable-error-code=import-untyped
          musicpal custom_components/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" --config-settings editable_mode=compat
      - name: Run pytest
        run: pytest tests/
