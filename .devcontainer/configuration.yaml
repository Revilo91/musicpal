# Home Assistant configuration for testing the musicpal integration

# Configure a default setup of Home Assistant (frontend, api, etc.)
default_config:

# HTTP configuration for development (Codespaces/VS Code)
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1
    - 172.16.0.0/12
    - 10.0.0.0/8
    - 192.168.0.0/16
  ip_ban_enabled: false
  login_attempts_threshold: -1

# Logging for custom component development
logger:
  default: info
  logs:
    custom_components.musicpal: debug

# Text frontend for development
lovelace:
  mode: yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# musicpal is config-flow only: add it via
# Settings -> Devices & Services -> Add Integration -> MusicPal.
# There is no YAML configuration.
